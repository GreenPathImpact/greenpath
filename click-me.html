<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log Bottles | GreenPath</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
    <a href="index.html" class="nav-button">Home</a>

    <nav class="top-navigation">
        <a href="click-me2.html">Log Wrappers</a>
        <a href="click-me3.html">Log Cans</a>
    </nav>
</header>

<main class="logging-page">

    <section class="logging-card">

        <h1 class="page-title">Log Bottles</h1>

        <p class="page-description">
            Enter your name and the number of bottles you collected.
        </p>

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >
        </div>

        <div class="form-group">
            <label for="bottles">Bottles Collected</label>
            <input
                type="number"
                id="bottles"
                min="1"
                placeholder="Enter a number"
            >
        </div>

        <div class="form-buttons">
            <button onclick="saveData()">Submit</button>
            <button class="secondary-button" onclick="showResults()">
                View Results
            </button>
        </div>

        <p id="message" class="success-message"></p>

        <div id="results" class="results-box"></div>

    </section>

    <section class="logging-images">
        <img src="bottle.png" alt="Collected bottles">
        <img src="water2.png" alt="Plastic bottle">
        <img src="bottle2.png" alt="Person recycling bottles">
    </section>

</main>

<script>
function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function saveData() {
    const nameInput = document.getElementById("name");
    const bottleInput = document.getElementById("bottles");
    const message = document.getElementById("message");
    const submitButton =
        document.querySelector(".form-buttons button:first-child");

    const name = nameInput.value.trim();
    const bottles = Number(bottleInput.value);

    if (name === "") {
        alert("Please enter your name.");
        nameInput.focus();
        return;
    }

    if (name.length > 50) {
        alert("Name cannot be longer than 50 characters.");
        nameInput.focus();
        return;
    }

    if (
        !Number.isInteger(bottles) ||
        bottles < 1 ||
        bottles > 1000
    ) {
        alert("Please enter a whole number between 1 and 1000.");
        bottleInput.focus();
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Saving...";
    message.textContent = "";

    try {
        const user = await signInVisitor();

        await db.collection("cleanupLogs").add({
            name: name,
            normalizedName: name.toLowerCase(),
            category: "bottle",
            quantity: bottles,
            userId: user.uid,
            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()
        });

        message.textContent =
            "Great job, " + name + "! You added " +
            bottles + " bottles.";

        nameInput.value = "";
        bottleInput.value = "";

        await showResults();
    } catch (error) {
        console.error("Bottle submission failed:", error);
        message.textContent =
            "We could not save your entry. Please try again.";
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit";
    }
}

async function showResults() {
    const resultsBox = document.getElementById("results");

    resultsBox.innerHTML =
        "<p>Loading bottle results...</p>";

    try {
        await signInVisitor();

        const snapshot = await db
            .collection("cleanupLogs")
            .where("category", "==", "bottle")
            .get();

        if (snapshot.empty) {
            resultsBox.innerHTML =
                "<p>No bottle results have been saved yet.</p>";
            return;
        }

        const people = {};
        let total = 0;

        snapshot.forEach((documentSnapshot) => {
            const entry = documentSnapshot.data();
            const name =
                String(entry.name || "Anonymous").trim();
            const nameKey =
                String(
                    entry.normalizedName ||
                    name.toLowerCase()
                );
            const quantity = Number(entry.quantity) || 0;

            if (!people[nameKey]) {
                people[nameKey] = {
                    displayName: name,
                    total: 0
                };
            }

            people[nameKey].total += quantity;
            total += quantity;
        });

        const sortedPeople = Object.values(people)
            .sort((first, second) =>
                second.total - first.total
            );

        let text = `
            <h2>Results</h2>

            <table class="results-table">
                <tr>
                    <th>Name</th>
                    <th>Bottles Collected</th>
                </tr>
        `;

        sortedPeople.forEach((person) => {
            text += `
                <tr>
                    <td>${escapeHtml(person.displayName)}</td>
                    <td>${person.total}</td>
                </tr>
            `;
        });

        text += `
            </table>

            <p class="grand-total">
                Total bottles collected: ${total}
            </p>
        `;

        resultsBox.innerHTML = text;
    } catch (error) {
        console.error("Could not load bottle results:", error);
        resultsBox.innerHTML =
            "<p>Unable to load results. Please try again.</p>";
    }
}
</script>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>

</body>
</html>
