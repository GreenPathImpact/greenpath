<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log Wrappers | GreenPath</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
    <a href="index.html" class="nav-button">Home</a>

    <nav class="top-navigation">
        <a href="click-me.html">Log Bottles</a>
        <a href="click-me3.html">Log Cans</a>
    </nav>
</header>

<main class="logging-page">

    <section class="logging-card">

        <h1 class="page-title">Log Wrappers</h1>

        <p class="page-description">
            Enter your name and the number of wrappers you collected.
        </p>

        <div class="form-group">
            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >
        </div>

        <div class="form-group">
            <label for="wrappers">Wrappers Collected</label>

            <input
                type="number"
                id="wrappers"
                min="1"
                placeholder="Enter a number"
            >
        </div>

        <div class="form-buttons">
            <button onclick="saveData()">Submit</button>

            <button
                class="secondary-button"
                onclick="showResults()"
            >
                View Results
            </button>
        </div>

        <p id="message" class="success-message"></p>

        <div id="results" class="results-box"></div>

    </section>

    <section class="logging-images">
        <img src="wrapper.png" alt="Person collecting wrappers">
        <img src="litter5.png" alt="Litter cleanup">
        <img src="wrapper2.png" alt="People collecting litter">
    </section>

</main>


<script>
function escapeHtml(value) {
    return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
async function saveData() {
 const nameInput=document.getElementById("name");
 const itemInput=document.getElementById("wrappers");
 const message=document.getElementById("message");
 const btn=document.querySelector(".form-buttons button:first-child");
 const name=nameInput.value.trim();
 const qty=Number(itemInput.value);
 if(name===""){alert("Please enter your name.");return;}
 if(!Number.isInteger(qty)||qty<1||qty>1000){alert("Please enter a whole number between 1 and 1000.");return;}
 btn.disabled=true;btn.textContent="Saving...";
 try {
   const user=await signInVisitor();
   await db.collection("cleanupLogs").add({
      name:name,
      normalizedName:name.toLowerCase(),
      category:"wrapper",
      quantity:qty,
      userId:user.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
   });
   message.textContent=`Great job, ${name}! You added ${qty} wrappers.`;
   nameInput.value=""; itemInput.value="";
   await showResults();
 } catch(e) {
   console.error(e);
   message.textContent="Could not save entry.";
 } finally {
   btn.disabled=false;btn.textContent="Submit";
 }
}
async function showResults(){
 const resultsBox=document.getElementById("results");
 const snap=await db.collection("cleanupLogs").where("category","==","wrapper").get();
 const people={}; let total=0;
 snap.forEach(doc=>{const d=doc.data();const k=d.normalizedName||d.name.toLowerCase(); if(!people[k])people[k]={displayName:d.name,total:0}; people[k].total+=(Number(d.quantity)||0); total+=(Number(d.quantity)||0);});
 if(Object.keys(people).length===0){resultsBox.innerHTML="<p>No wrapper results have been saved yet.</p>";return;}
 let html=`<h2>Results</h2><table class="results-table"><tr><th>Name</th><th>Wrappers Collected</th></tr>`;
 Object.values(people).sort((a,b)=>b.total-a.total).forEach(p=>{html+=`<tr><td>${escapeHtml(p.displayName)}</td><td>${p.total}</td></tr>`;});
 html+=`</table><p class="grand-total">Total wrappers collected: ${total}</p>`;
 resultsBox.innerHTML=html;
}
</script>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
</body>
</html>
